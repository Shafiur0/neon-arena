<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>NEON ARENA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#04060d;color:#dff6ff;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-user-select:none;user-select:none}
  canvas{display:block;position:absolute;inset:0;touch-action:none}

  #hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .45s ease}
  #hud.on{opacity:1}
  .top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:20px 26px}
  .stat{display:flex;flex-direction:column;gap:4px}
  .stat .k{font-size:10px;letter-spacing:.24em;color:#4f7f96;text-transform:uppercase}
  .stat .v{font-size:22px;letter-spacing:.08em;color:#bfefff;line-height:1}
  .stat.right{align-items:flex-end}
  .center{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-4px}
  #uiScore{font-size:38px;letter-spacing:.06em;line-height:1;color:#eafcff;
    text-shadow:0 0 18px rgba(45,226,255,.65),0 0 46px rgba(45,226,255,.28)}
  #uiCombo{font-size:11px;letter-spacing:.22em;color:#ffb84d;opacity:0;transition:opacity .25s;
    text-shadow:0 0 14px rgba(255,184,77,.7)}

  .bottom{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-end;padding:22px 26px}
  .hp{display:flex;flex-direction:column;gap:7px}
  .hp-bar{width:230px;height:7px;background:rgba(120,200,230,.13);border-radius:99px;overflow:hidden;
    border:1px solid rgba(120,200,230,.18)}
  .hp-fill{height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#1aa9d6,#6ff0ff);
    box-shadow:0 0 14px rgba(80,220,255,.8);transition:width .18s ease}
  .hp-fill.low{background:linear-gradient(90deg,#c62a2a,#ff6b5a);box-shadow:0 0 16px rgba(255,80,70,.9)}
  .hp-label{font-size:10px;letter-spacing:.2em;color:#4f7f96}
  .hp-label b{color:#9fd8ec;font-weight:400}

  .dash{display:flex;align-items:center;gap:9px;font-size:10px;letter-spacing:.2em;color:#4f7f96}
  .dash .pip{width:34px;height:4px;border-radius:99px;background:rgba(120,200,230,.15);overflow:hidden}
  .dash .pip i{display:block;height:100%;width:100%;background:#7a5cff;box-shadow:0 0 10px rgba(122,92,255,.9);
    transform-origin:left;transition:transform .1s linear}

  .overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:20;
    background:rgba(4,6,13,.74);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:1;transition:opacity .35s ease;padding:24px}
  .overlay.hidden{opacity:0;pointer-events:none}
  .overlay.hidden *{pointer-events:none!important}
  #menu{background:rgba(4,6,13,.52)}
  .panel{text-align:center;max-width:760px;width:100%}

  h1{font-size:clamp(38px,7.4vw,78px);font-weight:400;letter-spacing:.2em;line-height:1;
    color:#eafcff;text-shadow:0 0 28px rgba(45,226,255,.55),0 0 80px rgba(45,226,255,.25);margin-left:.2em}
  .sub{margin-top:16px;font-size:12px;letter-spacing:.32em;color:#5d92a8;text-transform:uppercase}
  .keys{margin:34px auto 0;display:flex;gap:26px;justify-content:center;flex-wrap:wrap;
    font-size:11px;letter-spacing:.12em;color:#6f9fb4}
  .keys div{display:flex;align-items:center;gap:8px}
  kbd{display:inline-block;padding:4px 8px;border:1px solid rgba(120,200,230,.3);border-radius:5px;
    background:rgba(120,200,230,.07);color:#bfefff;font-family:inherit;font-size:10px;letter-spacing:.1em}
  button{margin-top:38px;padding:15px 42px;background:rgba(45,226,255,.07);color:#dff6ff;
    border:1px solid rgba(45,226,255,.45);border-radius:2px;font-family:inherit;font-size:12px;
    letter-spacing:.28em;text-transform:uppercase;cursor:pointer;transition:all .22s ease}
  button:hover{background:rgba(45,226,255,.16);border-color:rgba(45,226,255,.9);
    box-shadow:0 0 30px rgba(45,226,255,.28),inset 0 0 22px rgba(45,226,255,.1)}
  button:active{transform:translateY(1px)}

  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:34px}
  @media (max-width:640px){.cards{grid-template-columns:1fr}}
  .card{pointer-events:auto;cursor:pointer;padding:22px 18px;text-align:left;
    background:rgba(10,20,32,.85);border:1px solid rgba(120,200,230,.2);border-radius:4px;
    transition:all .2s ease;position:relative;overflow:hidden}
  .card:hover{background:rgba(18,38,56,.95);border-color:rgba(45,226,255,.85);transform:translateY(-4px);
    box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 30px rgba(45,226,255,.16)}
  .card .ico{font-size:19px;color:#2de2ff;margin-bottom:14px;text-shadow:0 0 16px rgba(45,226,255,.8)}
  .card .nm{font-size:13px;letter-spacing:.14em;color:#eafcff;text-transform:uppercase}
  .card .ds{margin-top:9px;font-size:11px;line-height:1.7;color:#6f9fb4;letter-spacing:.04em}
  .card .tier{position:absolute;top:16px;right:16px;font-size:9px;letter-spacing:.16em;color:#3f6b80}

  .big{font-size:clamp(30px,5.4vw,54px);letter-spacing:.12em;color:#eafcff;margin-top:10px;
    text-shadow:0 0 26px rgba(45,226,255,.45)}
  .big.fail{color:#ff8f7a;text-shadow:0 0 30px rgba(255,90,70,.55)}
  .rows{margin-top:26px;display:flex;gap:46px;justify-content:center}
  .rows .r{display:flex;flex-direction:column;gap:7px}
  .rows .r span:first-child{font-size:10px;letter-spacing:.24em;color:#4f7f96}
  .rows .r span:last-child{font-size:26px;color:#bfefff;letter-spacing:.06em}
  .hint{margin-top:22px;font-size:11px;letter-spacing:.14em;color:#3f6b80}

  #fade{position:absolute;inset:0;pointer-events:none;z-index:15;opacity:0;
    background:radial-gradient(circle at center,transparent 38%,rgba(255,40,30,.55) 100%)}
  #vig{position:absolute;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse at 50% 46%,transparent 42%,rgba(0,0,0,.62) 100%)}
  #loading{position:absolute;inset:0;display:grid;place-items:center;z-index:40;background:#04060d;
    font-size:11px;letter-spacing:.34em;color:#4f7f96;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vig"></div>

<div id="hud">
  <div class="top">
    <div class="stat"><span class="k">Wave</span><span class="v" id="uiWave">01</span></div>
    <div class="center">
      <div id="uiScore">0</div>
      <div id="uiCombo"></div>
    </div>
    <div class="stat right"><span class="k">Best</span><span class="v" id="uiBest">0</span></div>
  </div>
  <div class="bottom">
    <div class="hp">
      <div class="hp-bar"><div class="hp-fill" id="uiHpFill"></div></div>
      <div class="hp-label">HULL <b id="uiHpText">100</b></div>
    </div>
    <div class="dash"><span>DASH</span><div class="pip"><i id="uiDashFill"></i></div></div>
  </div>
</div>

<div id="fade"></div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>NEON ARENA</h1>
    <div class="sub">Survive the swarm &middot; upgrade &middot; repeat</div>
    <div class="keys">
      <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</div>
      <div><kbd>SPACE</kbd> dash</div>
      <div><kbd>P</kbd> pause</div>
      <div><kbd>M</kbd> mute</div>
    </div>
    <button id="btnStart">Launch</button>
    <div class="hint">Guns fire automatically. Stay moving.</div>
  </div>
</div>

<div class="overlay hidden" id="upgrade">
  <div class="panel">
    <div class="sub">Wave cleared</div>
    <div class="big">CHOOSE ONE</div>
    <div class="cards" id="cards"></div>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="panel">
    <div class="sub">Signal lost</div>
    <div class="big fail">SYSTEM FAILURE</div>
    <div class="rows">
      <div class="r"><span>SCORE</span><span id="finalScore">0</span></div>
      <div class="r"><span>WAVE</span><span id="finalWave">1</span></div>
      <div class="r"><span>BEST</span><span id="finalBest">0</span></div>
    </div>
    <button id="btnRetry">Relaunch</button>
  </div>
</div>

<div class="overlay hidden" id="paused">
  <div class="panel">
    <div class="big">PAUSED</div>
    <div class="hint">Press P to resume</div>
  </div>
</div>

<div id="loading">Initialising arena</div>

<script>
  setTimeout(function () {
    if (!window.__gameReady) {
      var l = document.getElementById('loading');
      l.textContent = 'Could not load the 3D engine — an internet connection is required';
      l.style.letterSpacing = '.08em';
      l.style.textTransform = 'none';
    }
  }, 9000);
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ------------------------------------------------------------------ *
 *  CONSTANTS
 * ------------------------------------------------------------------ */
const ARENA_R = 26;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));

/* ------------------------------------------------------------------ *
 *  RENDERER / SCENE
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('game');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('loading').textContent = 'WebGL unavailable';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060d);
scene.fog = new THREE.FogExp2(0x04060d, 0.0165);

// sky dome: vertical gradient + horizon band
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(280, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      varying vec3 vP;
      void main(){
        float h = normalize(vP).y;
        vec3 low = vec3(0.0022, 0.0105, 0.024);
        vec3 high = vec3(0.0006, 0.0012, 0.0035);
        vec3 col = mix(low, high, smoothstep(-0.08, 0.55, h));
        float band = exp(-pow((h - 0.015) * 9.0, 2.0));
        col += vec3(0.006, 0.028, 0.048) * band;
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
scene.add(sky);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 16, 18);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.72, 0.6, 0.26);
composer.addPass(bloom);

scene.add(new THREE.HemisphereLight(0x8fd8ff, 0x0a0f1a, 0.85));
const key = new THREE.DirectionalLight(0xbfe9ff, 1.5);
key.position.set(8, 22, 10);
scene.add(key);
const rimA = new THREE.PointLight(0xff2d7a, 90, 70, 2);
rimA.position.set(-22, 8, -18);
scene.add(rimA);
const rimB = new THREE.PointLight(0x2de2ff, 90, 70, 2);
rimB.position.set(22, 8, 18);
scene.add(rimB);

/* ------------------------------------------------------------------ *
 *  ARENA
 * ------------------------------------------------------------------ */
const floorMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uPlayer: { value: new THREE.Vector2(0, 0) },
    uCamPos: { value: new THREE.Vector3(0, 18, 16) },
    uPix: { value: 0.0012 },
    uArena: { value: ARENA_R }
  },
  vertexShader: `
    varying vec2 vPos;
    void main(){
      vPos = position.xy;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform float uTime;
    uniform vec2 uPlayer;
    uniform vec3 uCamPos;
    uniform float uPix;
    uniform float uArena;
    varying vec2 vPos;

    float lineMask(float coord, float spacing, float pxw){
      float f = fract(coord / spacing);
      float d = min(f, 1.0 - f) * spacing;
      return 1.0 - smoothstep(0.0, pxw, d);
    }

    void main(){
      vec2 p = vPos;
      float d = length(p);
      float r = length(vec3(p.x, 0.0, p.y) - uCamPos);
      float pxw = r * uPix * 1.15;

      float minor = max(lineMask(p.x, 0.5, pxw), lineMask(p.y, 0.5, pxw));
      float major = max(lineMask(p.x, 2.0, pxw * 1.7), lineMask(p.y, 2.0, pxw * 1.7));

      float ripple = 0.70 + 0.30 * sin(uTime * 1.5 - d * 0.30);
      float edge = 1.0 - smoothstep(uArena * 0.78, uArena * 1.06, d);
      float ring = 1.0 - smoothstep(0.0, 0.30, abs(d - uArena));
      float glow = 1.0 - smoothstep(0.0, 8.5, distance(p, uPlayer));
      float outer = (minor * 0.06 + major * 0.15) * (1.0 - smoothstep(uArena, 58.0, d));
      float minorFade = 1.0 - smoothstep(18.0, 44.0, d);

      float a = (minor * 0.28 * minorFade + major * 0.50) * ripple * edge + ring * 0.95 + glow * 0.16 + outer;

      vec3 col = mix(vec3(0.06, 0.42, 0.72), vec3(0.25, 0.86, 1.0), glow) * a;
      gl_FragColor = vec4(col, a);
    }`,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const floor = new THREE.Mesh(new THREE.PlaneGeometry(130, 130), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
scene.add(floor);

// dark ground so the horizon reads and distant towers have a base
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(150, 64),
  new THREE.MeshBasicMaterial({ color: 0x060d16 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.08;
scene.add(ground);

const wallMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform float uTime;
    varying vec2 vUv;
    void main(){
      float a = pow(1.0 - vUv.y, 2.4) * 0.055;
      float stripes = 0.55 + 0.45 * sin(vUv.x * 220.0 + uTime * 0.8);
      float pulse = 0.75 + 0.25 * sin(uTime * 2.0 - vUv.y * 6.0);
      vec3 col = vec3(0.10, 0.52, 0.92) * a * stripes * pulse;
      gl_FragColor = vec4(col, a);
    }`,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.DoubleSide
});
const wall = new THREE.Mesh(new THREE.CylinderGeometry(ARENA_R, ARENA_R, 7, 96, 1, true), wallMat);
wall.position.y = 3.5;
scene.add(wall);

const ringGeo = new THREE.TorusGeometry(ARENA_R, 0.04, 6, 160);
const ringMat = new THREE.MeshBasicMaterial({ color: 0x5ce4ff });
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.04;
scene.add(ring);

const ring2 = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x2a6fa8, transparent: true, opacity: 0.55 }));
ring2.rotation.x = -Math.PI / 2;
ring2.position.y = 3.2;
scene.add(ring2);

// distant towers for depth
const pylonGeo = new THREE.BoxGeometry(1.6, 1, 1.6);
for (let i = 0; i < 22; i++) {
  const a = (i / 22) * TAU + rand(-0.1, 0.1);
  const r = rand(66, 96);
  const h = rand(6, 18);
  const accent = i % 3 === 0 ? 0xff2d7a : 0x2de2ff;
  const m = new THREE.Mesh(pylonGeo, new THREE.MeshBasicMaterial({ color: 0x0b1a28 }));
  m.scale.y = h;
  m.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r);
  scene.add(m);
  const wf = new THREE.Mesh(pylonGeo, new THREE.MeshBasicMaterial({
    color: accent, wireframe: true, transparent: true, opacity: 0.16
  }));
  wf.scale.y = h;
  wf.position.copy(m.position);
  scene.add(wf);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.05, 1.75),
    new THREE.MeshBasicMaterial({ color: accent }));
  cap.position.set(m.position.x, h, m.position.z);
  scene.add(cap);
}

// stars
{
  const n = 1100, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = rand(90, 240), th = rand(0, TAU), ph = rand(-0.05, 1.15);
    pos[i * 3] = Math.cos(th) * Math.cos(ph) * r;
    pos[i * 3 + 1] = Math.sin(ph) * r * 0.7 + 4;
    pos[i * 3 + 2] = Math.sin(th) * Math.cos(ph) * r;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0xaee6ff, size: 1.1, sizeAttenuation: true, transparent: true, opacity: 0.85, depthWrite: false
  })));
}

/* ------------------------------------------------------------------ *
 *  PLAYER
 * ------------------------------------------------------------------ */
const player = {
  pos: new THREE.Vector3(0, 1.25, 0),
  vel: new THREE.Vector3(),
  hp: 100, maxHp: 100,
  speed: 15,
  fireRate: 0.165, fireCd: 0,
  damage: 1, pierce: 0, shots: 1,
  invuln: 0,
  dashCd: 0, dashMax: 2.4, dashing: 0,
  facing: 0,
  alive: true
};

const playerGroup = new THREE.Group();
playerGroup.scale.setScalar(1.15);
scene.add(playerGroup);

const hullMat = new THREE.MeshStandardMaterial({
  color: 0x143547, emissive: 0x1ba8d8, emissiveIntensity: 0.5,
  metalness: 0.92, roughness: 0.22, flatShading: true
});

const shipShape = new THREE.Shape();
shipShape.moveTo(0, -1.7);
shipShape.lineTo(0.5, -0.5);
shipShape.lineTo(1.45, 0.5);
shipShape.lineTo(0.95, 0.74);
shipShape.lineTo(0.42, 0.42);
shipShape.lineTo(0.34, 0.96);
shipShape.lineTo(-0.34, 0.96);
shipShape.lineTo(-0.42, 0.42);
shipShape.lineTo(-0.95, 0.74);
shipShape.lineTo(-1.45, 0.5);
shipShape.lineTo(-0.5, -0.5);
shipShape.closePath();

const bodyGeo = new THREE.ExtrudeGeometry(shipShape, {
  depth: 0.26, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 1
});
bodyGeo.rotateX(Math.PI / 2);
bodyGeo.translate(0, 0.07, 0);
const hull = new THREE.Mesh(bodyGeo, hullMat);
playerGroup.add(hull);

const outlinePts = shipShape.getPoints(1).map(p => new THREE.Vector3(p.x, 0.16, p.y));
const outline = new THREE.LineLoop(
  new THREE.BufferGeometry().setFromPoints(outlinePts),
  new THREE.LineBasicMaterial({ color: 0x9ff8ff })
);
playerGroup.add(outline);

const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.23, 12, 8),
  new THREE.MeshStandardMaterial({ color: 0x060c14, emissive: 0x2de2ff, emissiveIntensity: 0.75, metalness: 1, roughness: 0.08 }));
cockpit.scale.set(1, 0.65, 1.9);
cockpit.position.set(0, 0.13, -0.55);
playerGroup.add(cockpit);

for (const s of [-1, 1]) {
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xff2d7a }));
  tip.position.set(s * 1.4, 0.12, 0.48);
  playerGroup.add(tip);
}

const engineMat = new THREE.MeshBasicMaterial({ color: 0x9beeff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
const engine = new THREE.Mesh(new THREE.ConeGeometry(0.26, 1.1, 10), engineMat);
engine.rotation.x = Math.PI / 2;
engine.position.set(0, 0, 1.05);
playerGroup.add(engine);

const pLight = new THREE.PointLight(0x2de2ff, 26, 18, 2);
playerGroup.add(pLight);

/* ------------------------------------------------------------------ *
 *  POOLS: bullets, enemy bullets, particles, rings
 * ------------------------------------------------------------------ */
const bulletGeo = new THREE.SphereGeometry(0.15, 6, 6);
bulletGeo.scale(1, 1, 3.2);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const bullets = [];
for (let i = 0; i < 140; i++) {
  const m = new THREE.Mesh(bulletGeo, bulletMat);
  m.visible = false;
  scene.add(m);
  bullets.push({ mesh: m, vel: new THREE.Vector3(), life: 0, dmg: 1, pierce: 0, active: false });
}

const eBulletGeo = new THREE.SphereGeometry(0.22, 8, 8);
const eBulletMat = new THREE.MeshBasicMaterial({ color: 0xff5ea8 });
const eBullets = [];
for (let i = 0; i < 60; i++) {
  const m = new THREE.Mesh(eBulletGeo, eBulletMat);
  m.visible = false;
  scene.add(m);
  eBullets.push({ mesh: m, vel: new THREE.Vector3(), life: 0, dmg: 10, active: false });
}

const P_MAX = 1000;
const pPos = new Float32Array(P_MAX * 3);
const pCol = new Float32Array(P_MAX * 3);
const pVel = new Float32Array(P_MAX * 3);
const pLife = new Float32Array(P_MAX);
const pMax = new Float32Array(P_MAX);
const pBase = new Float32Array(P_MAX * 3);
for (let i = 0; i < P_MAX; i++) { pPos[i * 3 + 1] = -999; }
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({
  size: 0.42, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending,
  depthWrite: false, sizeAttenuation: true
}));
points.frustumCulled = false;
scene.add(points);
let pCursor = 0;

function burst(x, y, z, count, color, speed, spread) {
  const c = new THREE.Color(color);
  for (let i = 0; i < count; i++) {
    const k = pCursor++ % P_MAX;
    pPos[k * 3] = x; pPos[k * 3 + 1] = y; pPos[k * 3 + 2] = z;
    const th = rand(0, TAU), ph = Math.acos(rand(-1, 1)), sp = rand(speed * 0.35, speed);
    pVel[k * 3] = Math.sin(ph) * Math.cos(th) * sp;
    pVel[k * 3 + 1] = Math.abs(Math.cos(ph)) * sp * 0.55 + rand(0, 2);
    pVel[k * 3 + 2] = Math.sin(ph) * Math.sin(th) * sp;
    pLife[k] = pMax[k] = rand(0.35, spread);
    pBase[k * 3] = c.r; pBase[k * 3 + 1] = c.g; pBase[k * 3 + 2] = c.b;
  }
}

const rings = [];
const ringGeoFx = new THREE.RingGeometry(0.93, 1.0, 40);
for (let i = 0; i < 12; i++) {
  const m = new THREE.Mesh(ringGeoFx, new THREE.MeshBasicMaterial({
    color: 0x6ff0ff, transparent: true, opacity: 0, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  m.rotation.x = -Math.PI / 2;
  m.visible = false;
  scene.add(m);
  rings.push({ mesh: m, t: 0, dur: 1, from: 1, to: 8, active: false });
}
function shockwave(x, z, color, from, to, dur) {
  const r = rings.find(r => !r.active) || rings[0];
  r.active = true; r.t = 0; r.dur = dur; r.from = from; r.to = to;
  r.mesh.visible = true;
  r.mesh.position.set(x, 0.12, z);
  r.mesh.material.color.set(color);
  r.mesh.scale.setScalar(from);
  r.mesh.material.opacity = 1;
}

const ENEMY_TYPES = {
  drifter: {
    hp: 3, speed: 8.6, radius: 1.0, dmg: 12, score: 10, color: 0xff3b6b,
    geo: () => new THREE.OctahedronGeometry(0.85, 0), wire: 1.45
  },
  brute: {
    hp: 15, speed: 4.0, radius: 1.9, dmg: 26, score: 40, color: 0xffa23b,
    geo: () => new THREE.IcosahedronGeometry(1.45, 0), wire: 1.18
  },
  spitter: {
    hp: 6, speed: 5.0, radius: 1.1, dmg: 10, score: 25, color: 0xb46bff,
    geo: () => new THREE.DodecahedronGeometry(0.95, 0), wire: 1.35
  }
};

const enemies = [];

function spawnEnemy(typeName, wave) {
  const t = ENEMY_TYPES[typeName];
  const a = rand(0, TAU);
  const r = ARENA_R + rand(2, 6);
  const g = new THREE.Group();
  g.position.set(Math.cos(a) * r, rand(1.1, 2.2), Math.sin(a) * r);

  const hpMul = 1 + (wave - 1) * 0.11;
  const mat = new THREE.MeshStandardMaterial({
    color: 0x140a12, emissive: t.color, emissiveIntensity: 1.15,
    metalness: 0.6, roughness: 0.35, flatShading: true
  });
  const mesh = new THREE.Mesh(t.geo(), mat);
  if (typeName === 'drifter') mesh.scale.set(1, 1.5, 1);
  g.add(mesh);

  const wire = new THREE.Mesh(t.geo(), new THREE.MeshBasicMaterial({
    color: t.color, wireframe: true, transparent: true, opacity: 0.3
  }));
  wire.scale.setScalar(t.wire);
  g.add(wire);

  scene.add(g);
  g.scale.setScalar(0.01);

  const e = {
    group: g, mesh, mat, wire, type: typeName,
    hp: Math.ceil(t.hp * hpMul), maxHp: Math.ceil(t.hp * hpMul),
    speed: t.speed * rand(0.9, 1.1), radius: t.radius, dmg: t.dmg, score: t.score,
    color: t.color, spawnT: 0, flash: 0, fireCd: rand(1.2, 2.4), phase: rand(0, TAU),
    wobble: rand(0.6, 1.6), scaleMul: typeName === 'drifter' ? 1.2 : 1.05
  };
  enemies.push(e);
  shockwave(g.position.x, g.position.z, t.color, 0.3, 2.6, 0.45);
  return e;
}

function killEnemy(e, idx) {
  const p = e.group.position;
  burst(p.x, p.y, p.z, 26, e.color, 11, 0.9);
  burst(p.x, p.y, p.z, 8, 0xffffff, 6, 0.5);
  shockwave(p.x, p.z, e.color, 0.4, 6.5, 0.5);
  shake(0.28);
  sfx.boom();
  scene.remove(e.group);
  e.mat.dispose(); e.wire.material.dispose();
  enemies.splice(idx, 1);

  state.kills++;
  if (state.mode === 'playing') {
    state.combo = Math.min(state.combo + 0.12, 6);
    state.comboTimer = 3.4;
    addScore(Math.round(e.score * state.combo));
  }

  if (Math.random() < 0.14) dropOrb(p.x, p.z);
}

/* ------------------------------------------------------------------ *
 *  AUDIO (synth, no assets)
 * ------------------------------------------------------------------ */
let actx = null, muted = false, master = null;
function audioInit() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.gain.value = 0.5;
    master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function tone(freq, dur, type, vol, slideTo) {
  if (!actx || muted) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, actx.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), actx.currentTime + dur);
  g.gain.setValueAtTime(vol, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.connect(g); g.connect(master);
  o.start(); o.stop(actx.currentTime + dur + 0.02);
}
function noise(dur, vol) {
  if (!actx || muted) return;
  const n = Math.floor(actx.sampleRate * dur);
  const buf = actx.createBuffer(1, n, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.4);
  const src = actx.createBufferSource(); src.buffer = buf;
  const g = actx.createGain(); g.gain.value = vol;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
  src.connect(f); f.connect(g); g.connect(master); src.start();
}
const sfx = {
  shoot() { tone(rand(620, 720), 0.06, 'square', 0.035, 240); },
  hit() { tone(rand(300, 380), 0.05, 'triangle', 0.05, 160); },
  boom() { noise(0.32, 0.16); tone(120, 0.24, 'sine', 0.09, 40); },
  hurt() { tone(150, 0.22, 'sawtooth', 0.09, 60); noise(0.16, 0.1); },
  dash() { tone(420, 0.18, 'sine', 0.05, 900); },
  pickup() { tone(660, 0.1, 'sine', 0.07, 990); },
  wave() { tone(440, 0.14, 'sine', 0.06, 660); setTimeout(() => tone(660, 0.2, 'sine', 0.06, 880), 120); },
  over() { tone(220, 0.7, 'sawtooth', 0.1, 55); noise(0.7, 0.14); }
};

 *  INPUT
 * ------------------------------------------------------------------ */
const keys = new Set();
const pointerDir = new THREE.Vector2();
let pointerActive = false, pStart = null;

window.addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) ev.preventDefault();
  keys.add(k);
  if (k === 'p' && (state.mode === 'playing' || state.mode === 'paused')) togglePause();
  if (k === 'm') { muted = !muted; }
  if (k === ' ' && state.mode === 'playing') dash();
});
window.addEventListener('keyup', ev => keys.delete(ev.key.toLowerCase()));
window.addEventListener('blur', () => { keys.clear(); pointerActive = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state.mode === 'playing') togglePause();
});

canvas.addEventListener('pointerdown', ev => {
  audioInit();
  pointerActive = true;
  pStart = { x: ev.clientX, y: ev.clientY };
  canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener('pointermove', ev => {
  if (!pointerActive || !pStart) return;
  const dx = (ev.clientX - pStart.x) / 70;
  const dy = (ev.clientY - pStart.y) / 70;
  pointerDir.set(clamp(dx, -1, 1), clamp(dy, -1, 1));
  if (pointerDir.length() > 1) pointerDir.normalize();
});
canvas.addEventListener('pointerup', () => { pointerActive = false; pointerDir.set(0, 0); });
canvas.addEventListener('pointercancel', () => { pointerActive = false; pointerDir.set(0, 0); });

function inputVector() {
  let x = 0, z = 0;
  if (keys.has('a') || keys.has('arrowleft')) x -= 1;
  if (keys.has('d') || keys.has('arrowright')) x += 1;
  if (keys.has('w') || keys.has('arrowup')) z -= 1;
  if (keys.has('s') || keys.has('arrowdown')) z += 1;
  if (x === 0 && z === 0 && pointerActive) { x = pointerDir.x; z = pointerDir.y; }
  const v = new THREE.Vector3(x, 0, z);
  if (v.lengthSq() > 1) v.normalize();
  return v;
}

function dash() {
  if (player.dashCd > 0 || player.dashing > 0) return;
  const dir = inputVector();
  if (dir.lengthSq() < 0.01) dir.set(Math.sin(player.facing), 0, Math.cos(player.facing)).multiplyScalar(-1);
  player.vel.addScaledVector(dir, 34);
  player.dashing = 0.18;
  player.invuln = Math.max(player.invuln, 0.28);
  player.dashCd = player.dashMax;
  shockwave(player.pos.x, player.pos.z, 0x7a5cff, 0.4, 5.5, 0.45);
  burst(player.pos.x, 1.2, player.pos.z, 14, 0x9a7cff, 7, 0.5);
  sfx.dash();
  shake(0.15);
}

/* ------------------------------------------------------------------ *
 *  COMBAT
 * ------------------------------------------------------------------ */
function nearestEnemy() {
  let best = null, bd = 27 * 27;
  for (const e of enemies) {
    const dx = e.group.position.x - player.pos.x;
    const dz = e.group.position.z - player.pos.z;
    const d = dx * dx + dz * dz;
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function fire(target) {
  const from = new THREE.Vector3();
  for (let i = 0; i < player.shots; i++) {
    const b = bullets.find(x => !x.active);
    if (!b) return;
    const side = (i % 2 === 0 ? -1 : 1) * (0.82 + Math.floor(i / 2) * 0.28);
    from.set(side, 0, -0.3);
    playerGroup.localToWorld(from);
    b.mesh.position.copy(from);
    b.mesh.visible = true;
    b.active = true;
    b.life = 1.4;
    b.dmg = player.damage;
    b.pierce = player.pierce;

    const dir = new THREE.Vector3().subVectors(target.group.position, from).normalize();
    const spread = (i - (player.shots - 1) / 2) * 0.045;
    dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), spread);
    dir.y *= 0.35;
    b.vel.copy(dir).multiplyScalar(62);
    b.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir.clone().normalize());
  }
  sfx.shoot();
  player.fireCd = player.fireRate;
}

function damagePlayer(amount) {
  if (player.invuln > 0 || state.mode !== 'playing') return;
  player.hp -= amount;
  player.invuln = 0.9;
  shake(0.7);
  damageFlash();
  sfx.hurt();
  burst(player.pos.x, 1.2, player.pos.z, 18, 0xff5a4a, 8, 0.6);
  if (player.hp <= 0) { player.hp = 0; gameOver(); }
}

function buildWave(n) {
  const q = [];
  const count = Math.min(6 + Math.floor(n * 2.2), 32);
  for (let i = 0; i < count; i++) {
    let t = 'drifter';
    const roll = Math.random();
    if (n >= 2 && roll < Math.min(0.12 + n * 0.03, 0.32)) t = 'brute';
    else if (n >= 3 && roll > 0.78) t = 'spitter';
    q.push(t);
  }
  return q;
}

function startWave(n) {
  state.wave = n;
  state.spawnQueue = buildWave(n);
  state.spawnTimer = 0.4;
  state.waveClearDelay = -1;
  ui.wave.textContent = String(n).padStart(2, '0');
  sfx.wave();
}

  ui.cards.innerHTML = '';

/* ------------------------------------------------------------------ *
 *  UPDATE
 * ------------------------------------------------------------------ */
const tmpV = new THREE.Vector3();

function updatePlayer(dt, t) {
  const input = inputVector();
  const target = tmpV.copy(input).multiplyScalar(player.speed);
  const responsiveness = player.dashing > 0 ? 2.5 : 9;
  player.vel.x = damp(player.vel.x, target.x, responsiveness, dt);
  player.vel.z = damp(player.vel.z, target.z, responsiveness, dt);

  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;

  const d = Math.hypot(player.pos.x, player.pos.z);
  if (d > ARENA_R - 1.4) {
    const nx = player.pos.x / d, nz = player.pos.z / d;
    player.pos.x = nx * (ARENA_R - 1.4);
    player.pos.z = nz * (ARENA_R - 1.4);
    const dot = player.vel.x * nx + player.vel.z * nz;
    if (dot > 0) { player.vel.x -= nx * dot * 1.4; player.vel.z -= nz * dot * 1.4; }
    if (dot > 6) shake(0.1);
  }

  if (player.dashing > 0) player.dashing -= dt;
  if (player.dashCd > 0) player.dashCd = Math.max(0, player.dashCd - dt);
  if (player.invuln > 0) player.invuln -= dt;
  if (player.fireCd > 0) player.fireCd -= dt;

  // facing
  const target2 = nearestEnemy();
  let faceDir;
  if (target2) {
    faceDir = tmpV.set(
      target2.group.position.x - player.pos.x, 0,
      target2.group.position.z - player.pos.z
    ).normalize();
  } else if (player.vel.lengthSq() > 1) {
    faceDir = tmpV.copy(player.vel).normalize();
  } else {
    faceDir = new THREE.Vector3(0, 0, -1);
  }
  const wantAngle = Math.atan2(-faceDir.x, -faceDir.z);
  let diff = wantAngle - player.facing;
  while (diff > Math.PI) diff -= TAU;
  while (diff < -Math.PI) diff += TAU;
  player.facing += diff * (1 - Math.exp(-9 * dt));

  playerGroup.position.set(player.pos.x, 1.25 + Math.sin(t * 2.4) * 0.09, player.pos.z);
  playerGroup.rotation.y = player.facing;
  playerGroup.rotation.z = -player.vel.x * 0.018;
  playerGroup.rotation.x = player.vel.z * 0.016;

  const flick = player.invuln > 0 ? (Math.sin(t * 60) > 0 ? 0.25 : 1) : 1;
  hullMat.emissiveIntensity = (0.5 + (player.dashing > 0 ? 1.4 : 0)) * flick;
  engine.scale.set(1, 1 + (player.dashing > 0 ? 1.8 : 0) + Math.sin(t * 20) * 0.08, 1);

  if (target2 && player.fireCd <= 0) fire(target2);
}

function updateEnemies(dt, t) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.spawnT = Math.min(1, e.spawnT + dt * 2.6);
    const s = e.spawnT < 1 ? 1 - Math.pow(1 - e.spawnT, 3) : 1;
    e.group.scale.setScalar(s * e.scaleMul * (1 + Math.sin(t * 4 + e.phase) * 0.03));

    const dx = player.pos.x - e.group.position.x;
    const dz = player.pos.z - e.group.position.z;
    const dist = Math.hypot(dx, dz) || 1;
    const nx = dx / dist, nz = dz / dist;

    if (e.type === 'spitter') {
      const want = 15;
      const push = dist > want + 1 ? 1 : (dist < want - 2 ? -1 : 0);
      e.group.position.x += nx * e.speed * push * dt;
      e.group.position.z += nz * e.speed * push * dt;
      e.group.position.x += -nz * e.speed * 0.55 * dt;
      e.group.position.z += nx * e.speed * 0.55 * dt;
      e.fireCd -= dt;
      if (e.fireCd <= 0 && e.spawnT > 0.9) {
        e.fireCd = rand(1.9, 2.8);
        fireEnemyBullet(e, nx, nz);
      }
    } else {
      const wob = Math.sin(t * e.wobble + e.phase) * 0.45;
      e.group.position.x += (nx - nz * wob) * e.speed * dt;
      e.group.position.z += (nz + nx * wob) * e.speed * dt;
    }

    e.group.position.y = 1.2 + Math.sin(t * 1.8 + e.phase) * 0.22;
    e.mesh.rotation.x += dt * 0.9;
    e.mesh.rotation.y += dt * 1.3;
    e.wire.rotation.x -= dt * 0.6;
    e.wire.rotation.z += dt * 0.5;

    if (e.flash > 0) {
      e.flash -= dt * 4;
      e.mat.emissiveIntensity = 1.15 + Math.max(0, e.flash) * 7;
    }

    if (e.spawnT > 0.55) {
      const pd = Math.hypot(e.group.position.x - player.pos.x, e.group.position.z - player.pos.z);
      if (pd < e.radius + 1.15) {
        damagePlayer(e.dmg);
        const kx = (e.group.position.x - player.pos.x) / (pd || 1);
        const kz = (e.group.position.z - player.pos.z) / (pd || 1);
        e.group.position.x += kx * 3.2;
        e.group.position.z += kz * 3.2;
        if (e.type !== 'brute') {
          e.hp -= 1;
          e.flash = 1;
          if (e.hp <= 0) { killEnemy(e, i); continue; }
        }
      }
    }
  }
}

function fireEnemyBullet(e, nx, nz) {
  const b = eBullets.find(x => !x.active);
  if (!b) return;
  b.active = true;
  b.life = 3.4;
  b.mesh.visible = true;
  b.mesh.position.set(e.group.position.x, e.group.position.y, e.group.position.z);
  b.vel.set(nx, 0, nz).normalize().multiplyScalar(13.5);
  tone(220, 0.1, 'sawtooth', 0.03, 140);
}

function updateBullets(dt) {
  for (const b of bullets) {
    if (!b.active) continue;
    b.life -= dt;
    if (b.life <= 0) { b.active = false; b.mesh.visible = false; continue; }
    b.mesh.position.addScaledVector(b.vel, dt);

    let hitSomething = false;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const dx = e.group.position.x - b.mesh.position.x;
      const dz = e.group.position.z - b.mesh.position.z;
      const dy = e.group.position.y - b.mesh.position.y;
      if (dx * dx + dz * dz + dy * dy < (e.radius + 0.35) ** 2) {
        e.hp -= b.dmg;
        e.flash = 1;
        burst(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z, 5, 0xd8fbff, 5, 0.35);
        sfx.hit();
        if (e.hp <= 0) { killEnemy(e, i); }
        if (b.pierce > 0) { b.pierce--; }
        else { hitSomething = true; }
        break;
      }
    }
    if (hitSomething) { b.active = false; b.mesh.visible = false; }
  }

  for (const b of eBullets) {
    if (!b.active) continue;
    b.life -= dt;
    if (b.life <= 0) { b.active = false; b.mesh.visible = false; continue; }
    b.mesh.position.addScaledVector(b.vel, dt);
    b.mesh.position.y = 1.2 + Math.sin(b.life * 8) * 0.1;
    const dx = b.mesh.position.x - player.pos.x;
    const dz = b.mesh.position.z - player.pos.z;
    if (dx * dx + dz * dz < 1.5) {
      damagePlayer(b.dmg);
      burst(b.mesh.position.x, b.mesh.position.y, b.mesh.position.z, 10, 0xff5ea8, 6, 0.5);
      b.active = false; b.mesh.visible = false;
    }
  }
}

function updateOrbs(dt, t) {
  for (let i = orbs.length - 1; i >= 0; i--) {
    const o = orbs[i];
    o.life -= dt;
    o.mesh.rotation.y += dt * 2;
    o.mesh.position.y = 1.0 + Math.sin(t * 3 + o.t) * 0.2;
    const dx = player.pos.x - o.mesh.position.x;
    const dz = player.pos.z - o.mesh.position.z;
    const d = Math.hypot(dx, dz);
    if (d < 7) {
      o.mesh.position.x += (dx / d) * 16 * dt;
      o.mesh.position.z += (dz / d) * 16 * dt;
    }
    if (d < 1.3) {
      player.hp = Math.min(player.maxHp, player.hp + 14);
      burst(o.mesh.position.x, o.mesh.position.y, o.mesh.position.z, 12, 0x4dffb0, 6, 0.5);
      sfx.pickup();
      scene.remove(o.mesh);
      orbs.splice(i, 1);
      continue;
    }
    if (o.life <= 0) { scene.remove(o.mesh); orbs.splice(i, 1); }
  }
}

function updateParticles(dt) {
  let dirty = false;
  for (let i = 0; i < P_MAX; i++) {
    if (pLife[i] <= 0) continue;
    dirty = true;
    pLife[i] -= dt;
    const k = i * 3;
    if (pLife[i] <= 0) {
      pCol[k] = pCol[k + 1] = pCol[k + 2] = 0;
      pPos[k + 1] = -999;
      continue;
    }
    pPos[k] += pVel[k] * dt;
    pPos[k + 1] += pVel[k + 1] * dt;
    pPos[k + 2] += pVel[k + 2] * dt;
    pVel[k] *= 0.96;
    pVel[k + 1] = pVel[k + 1] * 0.96 - 9 * dt;
    pVel[k + 2] *= 0.96;
    if (pPos[k + 1] < 0.08) { pPos[k + 1] = 0.08; pVel[k + 1] *= -0.35; }
    const f = Math.pow(Math.max(0, pLife[i] / pMax[i]), 1.4);
    pCol[k] = pBase[k] * f;
    pCol[k + 1] = pBase[k + 1] * f;
    pCol[k + 2] = pBase[k + 2] * f;
  }
  if (dirty) {
    pGeo.attributes.position.needsUpdate = true;
    pGeo.attributes.color.needsUpdate = true;
  }
  for (const r of rings) {
    if (!r.active) continue;
    r.t += dt;
    const k = r.t / r.dur;
    if (k >= 1) { r.active = false; r.mesh.visible = false; continue; }
    r.mesh.scale.setScalar(lerp(r.from, r.to, k));
    r.mesh.material.opacity = 1 - k;
  }
}

function updateWaves(dt) {
  if (state.mode !== 'playing') return;

  if (state.spawnQueue.length) {
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      spawnEnemy(state.spawnQueue.shift(), state.wave);
      state.spawnTimer = Math.max(0.16, 0.5 - state.wave * 0.022) * rand(0.75, 1.25);
    }
  } else if (enemies.length === 0) {
    if (state.waveClearDelay < 0) state.waveClearDelay = 0.9;
    state.waveClearDelay -= dt;
    if (state.waveClearDelay <= 0) {
      state.waveClearDelay = -1;
      showUpgrade();
    }
  }

  if (state.comboTimer > 0) {
    state.comboTimer -= dt;
    if (state.comboTimer <= 0) state.combo = 1;
  }
}

function updateCamera(dt, t) {
  const zoom = camera.aspect < 0.85 ? 1.5 : camera.aspect < 1.25 ? 1.3 : camera.aspect < 1.55 ? 1.1 : 1;
  if (state.mode === 'menu' || state.mode === 'over') {
    const a = t * 0.13;
    camera.position.x = damp(camera.position.x, Math.cos(a) * 23 * zoom, 2, dt);
    camera.position.z = damp(camera.position.z, Math.sin(a) * 23 * zoom, 2, dt);
    camera.position.y = damp(camera.position.y, (11.5 + Math.sin(t * 0.4) * 1.1) * zoom, 2, dt);
    camera.lookAt(0, 2.2, 0);
    return;
  }
  const desired = tmpV.set(
    player.pos.x * 0.6 - player.vel.x * 0.16,
    18.6 * zoom,
    player.pos.z * 0.6 + 15.4 * zoom
  );
  camera.position.x = damp(camera.position.x, desired.x, 4.5, dt);
  camera.position.y = damp(camera.position.y, desired.y, 4.5, dt);
  camera.position.z = damp(camera.position.z, desired.z, 4.5, dt);

  if (state.shake > 0.001) {
    camera.position.x += rand(-1, 1) * state.shake * 0.55;
    camera.position.y += rand(-1, 1) * state.shake * 0.4;
    camera.position.z += rand(-1, 1) * state.shake * 0.55;
    state.shake = Math.max(0, state.shake - dt * 2.6);
  }
  camera.lookAt(player.pos.x * 0.74, 1.4, player.pos.z * 0.74 - 2.2);
}

/* ------------------------------------------------------------------ *
 *  LOOP
 * ------------------------------------------------------------------ */
let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const t = now / 1000;
  state.time = t;

  floorMat.uniforms.uTime.value = t;
  floorMat.uniforms.uPlayer.value.set(player.pos.x, player.pos.z);
  wallMat.uniforms.uTime.value = t;
  ring2.rotation.z += dt * 0.05;

  if (state.mode === 'playing') {
    updatePlayer(dt, t);
    updateEnemies(dt, t);
    updateBullets(dt);
    updateOrbs(dt, t);
    updateWaves(dt);
    updateHud();
  } else if (state.mode === 'over' || state.mode === 'menu') {
    updateEnemies(dt, t);
    updateBullets(dt);
  } else if (state.mode === 'upgrade') {
    updateEnemies(dt * 0.12, t);
  }

  updateParticles(dt);
  updateCamera(dt, t);
  floorMat.uniforms.uCamPos.value.copy(camera.position);

  if (fadeT > 0) {
    fadeT = Math.max(0, fadeT - dt * 2.2);
    ui.fade.style.opacity = String(fadeT);
  }

  composer.render();
  requestAnimationFrame(tick);
}

window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
  floorMat.uniforms.uPix.value = 2 * Math.tan((camera.fov * Math.PI / 180) / 2) / h;
});
floorMat.uniforms.uPix.value = 2 * Math.tan((camera.fov * Math.PI / 180) / 2) / window.innerHeight;

ui.best.textContent = state.best.toLocaleString();
ui.hud.classList.remove('on');
document.getElementById('loading').style.display = 'none';
window.__gameReady = true;
requestAnimationFrame(tick);
</script>
